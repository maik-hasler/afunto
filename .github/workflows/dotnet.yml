name: Build and Test Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This workflow used to gate on `paths:` in the triggers above, but GitHub never
  # resolves a required status check whose *workflow* was skipped by a paths filter -
  # it reports "Expected - waiting for status" forever on a PR that never touches
  # backend/frontend/keycloak (#2204). The workflow now always triggers; this job
  # decides which of the real jobs below are worth running, and `required` at the
  # bottom always reports a result either way, so it - not any individual job here -
  # is what branch protection should require.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'backend/**'
              - 'frontend/**'
              - 'keycloak/**'
              - '.github/workflows/dotnet.yml'

  visual-test-shard-partition:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the shards partition the VisualTests suite
        run: |
          shards=4
          : > /tmp/assigned.txt
          for shard in $(seq 1 "$shards"); do
            out=$(.github/scripts/visual-test-shard.sh "$shard" "$shards")
            echo "$out" | sed -n 's/^filter=//p' \
              | tr '|' '\n' | sed 's#^/\*/\*/##; s#/\*$##; s#^(##; s#)$##' >> /tmp/assigned.txt
            echo "shard $shard/$shards: $(echo "$out" | sed -n 's/^classes=//p') classes, $(echo "$out" | sed -n 's/^expected-tests=//p') tests"
          done

          grep -l '^\s*\[Test\]' backend/tests/VisualTests/*.cs \
            | xargs -n1 basename | sed 's/\.cs$//' | sort > /tmp/discovered.txt
          sort /tmp/assigned.txt > /tmp/assigned-sorted.txt

          if ! diff -u /tmp/discovered.txt /tmp/assigned-sorted.txt; then
            echo "::error::The visual-tests shards no longer partition the suite - a test class is missing from every shard, or assigned to more than one. Left = classes with [Test] methods, right = classes the shard filters select."
            exit 1
          fi
          echo "OK: $(wc -l < /tmp/discovered.txt) test classes, each in exactly one shard."

  format-check:
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Verify formatting
        working-directory: backend
        run: dotnet format --verify-no-changes --no-restore

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Harden apt against CI mirror stalls
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Wait for background apt/dpkg locks to clear
        run: |
          for i in $(seq 1 60); do
            if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
              echo "apt/dpkg lock held (attempt $i/60) - waiting..."
              sleep 5
            else
              exit 0
            fi
          done
          echo "::warning::apt/dpkg lock still held after 5 minutes - proceeding anyway"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Restore backend
        working-directory: backend
        run: dotnet restore --locked-mode

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore

      - name: Check for vulnerable NuGet packages
        working-directory: backend
        run: |
          output=$(dotnet list package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet package(s) detected - see output above, and https://github.com/advisories for remediation."
            exit 1
          fi

      # Only what the backend build itself produces. The TypeScript client is
      # generated separately (@hey-api/openapi-ts) and guarded by
      # `pnpm check:client-current` in frontend-checks.yml, which regenerates
      # and compares rather than relying on this build having run.
      - name: Verify generated API client and OpenAPI doc are committed
        run: |
          if ! git diff --exit-code -- \
            backend/src/Api/wwwroot/openapi-v1.json \
            backend/tests/IntegrationTests/ApiClient.cs
          then
            echo "::error::The committed OpenAPI document or API client is out of date - run 'dotnet build tests/IntegrationTests' in backend/ and commit the result."
            exit 1
          fi

      - name: Check for pending EF Core model changes
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes -p src/Infrastructure -s src/Api --no-build

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: |
            backend/**/bin/**
            backend/**/obj/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  fast-tests:
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - name: Test - Application.UnitTests
        working-directory: backend
        run: dotnet run --project tests/Application.UnitTests --no-restore --no-build --coverage --coverage-output-format cobertura --coverage-output application-unittests.cobertura.xml

      - name: Test - ArchitectureTests
        working-directory: backend
        run: dotnet run --project tests/ArchitectureTests --no-restore --no-build --coverage --coverage-output-format cobertura --coverage-output architecturetests.cobertura.xml

      - name: Publish coverage summary
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: |
          {
            echo "### Code coverage"
            echo
            echo "| Project | Lines | Branches |"
            echo "| --- | --- | --- |"
            for entry in \
              "application-unittests.cobertura.xml:Application.UnitTests" \
              "architecturetests.cobertura.xml:ArchitectureTests"
            do
              filename="${entry%%:*}"
              label="${entry##*:}"
              report=$(find . -path "*/TestResults/$filename" -print -quit)
              if [ -z "$report" ]; then
                echo "| $label | _missing_ | _missing_ |"
                continue
              fi
              line_rate=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -1)
              branch_rate=$(sed -n 's/.*branch-rate="\([0-9.]*\)".*/\1/p' "$report" | head -1)
              line_pct=$(awk -v r="$line_rate" 'BEGIN { printf "%.0f%%", r * 100 }')
              branch_pct=$(awk -v r="$branch_rate" 'BEGIN { printf "%.0f%%", r * 100 }')
              echo "| $label | $line_pct | $branch_pct |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker pull ghcr.io/axllent/mailpit:v1.31.2
          docker pull rustfs/rustfs:1.0.0

      - name: Test - IntegrationTests (Aspire + Docker)
        working-directory: backend
        run: dotnet run --project tests/IntegrationTests --no-restore --no-build

  visual-tests:
    needs: [changes, build]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker pull ghcr.io/axllent/mailpit:v1.31.2
          docker pull rustfs/rustfs:1.0.0

      - name: Resolve shard filter
        id: shard
        run: |
          shard=$(.github/scripts/visual-test-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}")
          echo "$shard"
          echo "$shard" >> "$GITHUB_OUTPUT"

      - name: Test - VisualTests (Aspire + Docker + Playwright)
        working-directory: backend
        run: |
          dotnet run --project tests/VisualTests --no-restore --no-build -- \
            --treenode-filter "${{ steps.shard.outputs.filter }}" \
            --minimum-expected-tests "${{ steps.shard.outputs.min-tests }}"

      - name: Report Aspire stack startup cost
        if: always()
        working-directory: backend
        run: |
          timing=$(find tests/VisualTests/bin -name aspire-boot-seconds.txt -print -quit 2>/dev/null || true)
          if [ -n "$timing" ]; then
            echo "shard ${{ matrix.shard }}: Aspire stack ready in $(cat "$timing")s" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::shard ${{ matrix.shard }}: no Aspire boot timing recorded - the stack never finished starting"
          fi

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: backend/tests/VisualTests/bin/**/trace-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  # The one job that always reports a result regardless of the paths filter above -
  # configure this as the required status check in branch protection instead of any
  # individual job's name (which may not run at all on a given PR, and in visual-tests'
  # case is four matrix legs, not one - see the comment on the `changes` job).
  required:
    name: Required
    if: always()
    needs:
      - changes
      - visual-test-shard-partition
      - build
      - format-check
      - fast-tests
      - integration-tests
      - visual-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
