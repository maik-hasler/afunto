name: Frontend Checks

on:
  workflow_call:
    inputs:
      vite_keycloak_authority_url:
        description: 'Full Keycloak realm authority URL (VITE_KEYCLOAK_AUTHORITY_URL build-arg/runtime env)'
        required: true
        type: string
      vite_keycloak_client_id:
        description: 'Keycloak client id (VITE_KEYCLOAK_CLIENT_ID build-arg)'
        required: true
        type: string
      keycloak_origin:
        description: 'Bare Keycloak origin (scheme+host, no /realms/... path) expected in the CSP frame-src'
        required: true
        type: string
      vite_api_url:
        description: 'Backend API origin (VITE_API_URL build-arg/runtime env)'
        required: true
        type: string
      storage_public_url:
        description: 'Public object storage origin (STORAGE_PUBLIC_URL runtime env)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # Fails on any high/critical advisory in a *production* dependency. The three
        # fast-uri (GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7, GHSA-4c8g-83qw-93j6)
        # advisories are recorded as accepted in package.json's pnpm.auditConfig.ignoreGhsas:
        # fast-uri is reachable only via @hookform/resolvers/ajv, a subpath nothing in this
        # app imports (the three real imports are all .../zod), and a production build of
        # the bundle confirms it is tree-shaken out entirely (#2204). Re-verify that before
        # ever adding another ignoreGhsas entry - it is not a blanket exemption for fast-uri.
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Check i18n key parity
        run: pnpm i18n:check

      - name: Check AGENTS.md inventory
        run: pnpm check:agents-inventory

      - name: Check module graph (cycles, orphans, unresolvable imports)
        run: pnpm check:deps

      - name: Check a11y rule parity between the component and page scans
        run: pnpm check:a11y-rules

      - name: Check frontend constants still match their backend counterparts
        run: pnpm check:backend-constants

      # The generated client and the OpenAPI document it comes from are both
      # committed. Without this, an endpoint change lands with a stale client
      # and surfaces as a type error in an unrelated PR days later.
      - name: Check the generated API client is current
        run: pnpm check:client-current

      - name: Check the design-token mirror matches the stylesheet
        run: pnpm check:design-tokens

      - name: Check nginx CSP header
        run: pnpm check:nginx-csp

      - name: Check config.js defer
        run: pnpm check:config-defer

      - name: Check nginx gzip_static wiring
        run: pnpm check:nginx-gzip-static

      - name: Check nginx HSTS header
        run: pnpm check:nginx-hsts

      - name: Check nginx Permissions-Policy header
        run: pnpm check:nginx-permissions-policy

      - name: Check PWA precache scoping
        run: pnpm check:pwa-precache

      - name: Check PWA manifest completeness
        run: pnpm check:pwa-manifest

      - name: Check PWA offline caching
        run: pnpm check:pwa-offline-caching

      - name: Check PWA silent-renew navigate-fallback exclusion
        run: pnpm check:pwa-silent-renew-fallback

      - name: Type check
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Coverage rather than a bare run: vitest.config.ts carries per-directory
      # thresholds, and they only mean anything if something fails on them.
      - name: Unit tests
        run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Byte budgets, not a report: a chunk that outgrows the slack recorded in
      # .size-limit.cjs fails here rather than landing unnoticed. The build job
      # is the only one that already has dist/, so it is where this belongs.
      - name: Check bundle budgets
        run: pnpm size

  docker-image:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build runtime image
        run: |
          docker build \
            --build-arg VITE_KEYCLOAK_AUTHORITY_URL=${{ inputs.vite_keycloak_authority_url }} \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=${{ inputs.vite_keycloak_client_id }} \
            --build-arg VITE_API_URL=${{ inputs.vite_api_url }} \
            -t frontend-smoke-test \
            frontend

      - name: Run container with a runtime config
        run: |
          docker run -d --name frontend-smoke-test -p 8081:80 \
            -e VITE_KEYCLOAK_AUTHORITY_URL=${{ inputs.vite_keycloak_authority_url }} \
            -e VITE_KEYCLOAK_CLIENT_ID=${{ inputs.vite_keycloak_client_id }} \
            -e VITE_API_URL=${{ inputs.vite_api_url }} \
            -e STORAGE_PUBLIC_URL=${{ inputs.storage_public_url }} \
            -e OPERATOR_NAME="CI Smoke Test Operator" \
            frontend-smoke-test

          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8081/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs frontend-smoke-test || true

      - name: index.html is served
        run: |
          code=$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost:8081/)
          [ "$code" = "200" ] || { echo "::error::GET / returned $code"; exit 1; }

      - name: config.js is substituted, not left as a template placeholder
        run: |
          body=$(curl -fsS http://localhost:8081/config.js)
          echo "$body"
          if echo "$body" | grep -q '\${'; then
            echo "::error::config.js still contains an unsubstituted \${...} placeholder"
            exit 1
          fi
          echo "$body" | grep -q "${{ inputs.vite_api_url }}" || { echo "::error::config.js does not contain the expected API_URL"; exit 1; }
          echo "$body" | grep -q "CI Smoke Test Operator" || { echo "::error::config.js does not contain the runtime-injected OPERATOR_NAME"; exit 1; }

      - name: Content-Security-Policy header reflects runtime origins
        run: |
          csp=$(curl -fsSI http://localhost:8081/ | tr -d '\r' | grep -i '^content-security-policy:')
          echo "$csp"
          [ -n "$csp" ] || { echo "::error::No Content-Security-Policy header"; exit 1; }
          echo "$csp" | grep -q "${{ inputs.vite_api_url }}" || { echo "::error::CSP does not allow the runtime API origin (connect-src)"; exit 1; }
          echo "$csp" | grep -q "${{ inputs.keycloak_origin }}" || { echo "::error::CSP does not allow the runtime Keycloak origin (frame-src)"; exit 1; }
          echo "$csp" | grep -qE "frame-src[^;]*'self'" || { echo "::error::CSP frame-src does not allow 'self' - automaticSilentRenew/signinSilent()'s same-origin hidden iframe (silent_redirect_uri) would be blocked in the released image (#2042)"; exit 1; }
          echo "$csp" | grep -q "${{ inputs.storage_public_url }}" || { echo "::error::CSP does not allow the runtime storage origin (img-src) - cross-origin images would be blocked"; exit 1; }

      - name: silent-renew.html allows same-origin framing
        run: |
          headers=$(curl -fsSI http://localhost:8081/silent-renew.html | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi '^x-frame-options: SAMEORIGIN$' || { echo "::error::/silent-renew.html's X-Frame-Options is not SAMEORIGIN - the site-wide DENY would block automaticSilentRenew's hidden iframe (#2042)"; exit 1; }
          echo "$headers" | grep -i '^content-security-policy:' | grep -qE "frame-ancestors[^;]*'self'" || { echo "::error::/silent-renew.html's CSP does not allow frame-ancestors 'self' (#2042)"; exit 1; }

      - name: gzip_static serves precompressed assets
        run: |
          asset=$(curl -fsS http://localhost:8081/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::Could not find an entry JS asset reference in index.html"; exit 1; }
          encoding=$(curl -fsSI -H "Accept-Encoding: gzip" "http://localhost:8081${asset}" | tr -d '\r' | grep -i '^content-encoding:')
          echo "$encoding"
          echo "$encoding" | grep -qi "gzip" || { echo "::error::${asset} was not served with Content-Encoding: gzip"; exit 1; }

      - name: manifest.<locale>.webmanifest is served with the correct Content-Type
        run: |
          for locale in de en; do
            content_type=$(curl -fsSI "http://localhost:8081/manifest.${locale}.webmanifest" | tr -d '\r' | grep -i '^content-type:')
            echo "$content_type"
            echo "$content_type" | grep -qi "application/manifest+json" \
              || { echo "::error::manifest.${locale}.webmanifest was not served as application/manifest+json"; exit 1; }
          done

      - name: Web app manifest is served with a complete install listing
        run: |
          for locale in de en; do
            manifest=$(curl -fsS "http://localhost:8081/manifest.${locale}.webmanifest")
            echo "$manifest"
            echo "$manifest" | jq -e '.id' > /dev/null || { echo "::error::manifest.${locale}.webmanifest has no id"; exit 1; }
            echo "$manifest" | jq -e ".lang == \"${locale}\"" > /dev/null \
              || { echo "::error::manifest.${locale}.webmanifest has lang != \"${locale}\""; exit 1; }
            echo "$manifest" | jq -e '[.screenshots[] | select(.form_factor == "narrow")] | length > 0' > /dev/null \
              || { echo "::error::manifest.${locale}.webmanifest has no narrow screenshot - Chrome on Android needs one for the richer install UI"; exit 1; }
            echo "$manifest" | jq -e '[.screenshots[] | select(.form_factor == "wide")] | length > 0' > /dev/null \
              || { echo "::error::manifest.${locale}.webmanifest has no wide screenshot"; exit 1; }
            echo "$manifest" | jq -e '.shortcuts | length > 0' > /dev/null || { echo "::error::manifest.${locale}.webmanifest has no shortcuts"; exit 1; }
            for src in $(echo "$manifest" | jq -r '[.screenshots[].src] + [.shortcuts[].icons[].src] + [.icons[].src] | .[]' | sort -u); do
              code=$(curl -fsS -o /dev/null -w "%{http_code}" "http://localhost:8081${src}" || echo 000)
              [ "$code" = "200" ] || { echo "::error::manifest asset ${src} returned $code - the install prompt drops the whole listing over one missing file"; exit 1; }
            done
          done

      - name: Stop container
        if: always()
        run: docker rm -f frontend-smoke-test || true
