name: Keycloak Realm Import Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See dotnet.yml's `changes`/`required` jobs for why this workflow no longer
  # filters its triggers by `paths:` (#2204) - GitHub can't resolve a required
  # status check for a workflow a paths filter skipped outright.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'keycloak/**'
              - '.github/workflows/keycloak-realm-import.yml'

  import-check:
    name: Import realm on the released Keycloak version
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Security properties of the realm that ships baked into the published image.
      # Each has already cost a fix once, so they are asserted rather than trusted:
      # #1167 (a public client with ROPC in a released image turns credential
      # stuffing into one scriptable request), #2197 (an enabled admin account with
      # a published password is a live takeover). DEMO_USERS_ENABLED is declared
      # here on purpose: flipping it takes an explicit edit to this file, which is
      # the forcing function that makes the matching update to keycloak/AGENTS.md's
      # Test Users section and README.md's Test users table visible in the same PR.
      # That is exactly what #2308 did not do, leaving both docs wrong for months.
      - name: Assert realm security invariants
        env:
          DEMO_USERS_ENABLED: "true"
        run: |
          set -euo pipefail
          REALM=keycloak/realms/afunto-realm.json

          ft_enabled=$(jq -r '.clients[] | select(.clientId == "frontend-test") | .enabled' "$REALM")
          ft_ropc=$(jq -r '.clients[] | select(.clientId == "frontend-test") | .directAccessGrantsEnabled' "$REALM")
          if [ "$ft_enabled" != "false" ] || [ "$ft_ropc" != "true" ]; then
            echo "::error::'frontend-test' must stay enabled=false with directAccessGrantsEnabled=true (got enabled=$ft_enabled, ropc=$ft_ropc). It is a public ROPC client and this realm ships inside the published image (#1167); AppHost.cs enables it for local runs only."
            exit 1
          fi

          plaintext=$(jq -r '[.users[]? | select(.credentials[]? | has("value")) | .username] | join(", ")' "$REALM")
          if [ -n "$plaintext" ]; then
            echo "::error::These users carry a plaintext credential 'value': $plaintext. Credentials must stay pre-hashed under 'secretData' - plaintext is validated against the realm passwordPolicy during --import-realm and crashes the import, besides publishing the password in the image."
            exit 1
          fi

          for u in vera olaf admin; do
            got=$(jq -r --arg u "$u" '.users[] | select(.username == $u) | .enabled' "$REALM")
            if [ "$got" != "$DEMO_USERS_ENABLED" ]; then
              echo "::error::Demo user '$u' has enabled=$got but this workflow declares DEMO_USERS_ENABLED=$DEMO_USERS_ENABLED. If the change is intended, edit that literal AND update keycloak/AGENTS.md's Test Users section and README.md's Test users table in the same PR - they state this posture in prose and have been wrong before (#2308)."
              exit 1
            fi
          done

          echo "Realm security invariants hold: frontend-test disabled with ROPC reserved for it, all credentials pre-hashed, demo users enabled=$DEMO_USERS_ENABLED as declared."

      - name: Resolve Keycloak version
        id: kc
        run: |
          KC_VERSION=$(grep -m1 'FROM quay.io/keycloak/keycloak:' keycloak/Dockerfile \
            | sed 's/.*keycloak:\([^ ]*\).*/\1/')
          echo "version=$KC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing realm import on quay.io/keycloak/keycloak:$KC_VERSION"

      - name: Import realm and verify it is served
        env:
          KC_VERSION: ${{ steps.kc.outputs.version }}
        run: |
          set -u
          KC_FRONTEND_URL="https://app.example.test"
          IMPORT_DIR="$RUNNER_TEMP/kc-import"
          mkdir -p "$IMPORT_DIR"
          cp keycloak/realms/*-realm.json "$IMPORT_DIR/"

          docker run -d --name kc-import-check -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e "KC_FRONTEND_URL=$KC_FRONTEND_URL" \
            -e KEYCLOAK_BACKEND_SECRET=dummy-not-a-real-secret \
            -e KC_SMTP_HOST=localhost \
            -e KC_SMTP_PORT=1025 \
            -e KC_SMTP_FROM=noreply@example.test \
            -e KC_SMTP_USER=test \
            -e KC_SMTP_PASSWORD=test \
            -v "$IMPORT_DIR:/opt/keycloak/data/import:ro" \
            "quay.io/keycloak/keycloak:$KC_VERSION" \
            start-dev --import-realm

          WELL_KNOWN="http://localhost:8080/realms/afunto/.well-known/openid-configuration"
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "$WELL_KNOWN" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' kc-import-check 2>/dev/null)" != "true" ]; then
              break
            fi
            sleep 2
          done

          placeholders=""
          clients=""
          if [ "$ready" = "1" ]; then
            token=$(curl -fsS -X POST \
              "http://localhost:8080/realms/master/protocol/openid-connect/token" \
              -d 'grant_type=password' -d 'client_id=admin-cli' \
              -d 'username=admin' -d 'password=admin' \
              | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p') || true
            clients=$(curl -fsS \
              -H "Authorization: Bearer $token" \
              "http://localhost:8080/admin/realms/afunto/clients") || true
            placeholders=$(printf '%s' "$clients" | grep -o '\${[A-Z_]*}' || true)
          fi

          echo "::group::Keycloak container logs"
          docker logs kc-import-check || true
          echo "::endgroup::"

          docker rm -f kc-import-check >/dev/null 2>&1 || true

          if [ "$ready" != "1" ]; then
            echo "::error::Keycloak $KC_VERSION did not serve the 'afunto' realm after --import-realm (see logs above)."
            exit 1
          fi

          if [ "$ready" = "1" ] && ! printf '%s' "$clients" | grep -q '"clientId":"frontend"'; then
            echo "::error::Could not read the imported clients back through the admin API, so the placeholder check below proves nothing."
            exit 1
          fi

          if [ -n "$placeholders" ]; then
            echo "::error::The imported clients still carry unresolved placeholders ($placeholders) - Keycloak did not substitute them, so OIDC redirects (or the backend's client secret) would fail at runtime."
            exit 1
          fi

          frontend_redirect_uris=$(printf '%s' "$clients" | jq -r '.[] | select(.clientId == "frontend") | .redirectUris[]')
          missing=""
          for path in /callback /silent-renew.html; do
            if ! printf '%s\n' "$frontend_redirect_uris" | grep -qF "$KC_FRONTEND_URL$path"; then
              missing="$missing $KC_FRONTEND_URL$path"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::The imported 'frontend' client's redirectUris are missing:$missing - frontend/src/main.tsx sends these as redirect_uri/silent_redirect_uri, so Keycloak would reject the authorization request with invalid_redirect_uri."
            exit 1
          fi

          echo "Realm 'afunto' imported and served successfully on Keycloak $KC_VERSION, with all client placeholders resolved and the 'frontend' client's redirectUris covering every URI main.tsx can send."

  # The always-running required status check - see dotnet.yml's `required` job.
  required:
    name: Required
    if: always()
    needs: [changes, import-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
