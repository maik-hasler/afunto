name: Publish

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Restore backend
        working-directory: backend
        run: dotnet restore --locked-mode

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore

      - name: Check for vulnerable NuGet packages
        working-directory: backend
        run: |
          output=$(dotnet list package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet package(s) detected - see output above, and https://github.com/advisories for remediation."
            exit 1
          fi

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: |
            backend/**/bin/**
            backend/**/obj/**
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  backend-fast-tests:
    name: Backend Fast Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - name: Test - Application.UnitTests
        working-directory: backend
        run: dotnet run --project tests/Application.UnitTests --no-restore --no-build

      - name: Test - ArchitectureTests
        working-directory: backend
        run: dotnet run --project tests/ArchitectureTests --no-restore --no-build

  backend-integration-tests:
    name: Backend Integration Tests
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker pull ghcr.io/axllent/mailpit:v1.31.2
          docker pull rustfs/rustfs:1.0.0

      - name: Test - IntegrationTests (Aspire + Docker)
        working-directory: backend
        run: dotnet run --project tests/IntegrationTests --no-restore --no-build

  # Sharded exactly as dotnet.yml's visual-tests job is - see that job's comment
  # for why (afunto#2145). The two must stay in step: this is the same
  # suite gating a release that the PR gate runs, so a split that only existed on
  # one side would mean the release path and the PR path disagree about how long
  # the gate takes and which tests ran together.
  backend-visual-tests:
    name: Backend Visual Tests (shard ${{ matrix.shard }})
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: backend

      - name: Fix executable bit on downloaded build output
        working-directory: backend
        run: find . -path "*/bin/*" -type f -exec chmod +x {} +

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}

      - name: Pre-pull Docker images
        run: |
          docker pull quay.io/keycloak/keycloak:26.7.4
          docker pull ghcr.io/axllent/mailpit:v1.31.2
          docker pull rustfs/rustfs:1.0.0

      - name: Resolve shard filter
        id: shard
        run: |
          shard=$(.github/scripts/visual-test-shard.sh "${{ matrix.shard }}" "${{ strategy.job-total }}")
          echo "$shard"
          echo "$shard" >> "$GITHUB_OUTPUT"

      - name: Test - VisualTests (Aspire + Docker + Playwright)
        working-directory: backend
        run: |
          dotnet run --project tests/VisualTests --no-restore --no-build -- \
            --treenode-filter "${{ steps.shard.outputs.filter }}" \
            --minimum-expected-tests "${{ steps.shard.outputs.min-tests }}"

      - name: Report Aspire stack startup cost
        if: always()
        working-directory: backend
        run: |
          timing=$(find tests/VisualTests/bin -name aspire-boot-seconds.txt -print -quit 2>/dev/null || true)
          if [ -n "$timing" ]; then
            echo "shard ${{ matrix.shard }}: Aspire stack ready in $(cat "$timing")s" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::shard ${{ matrix.shard }}: no Aspire boot timing recorded - the stack never finished starting"
          fi

  # Builds the real release image (not `dotnet run`) and boots it against a real
  # Postgres/Keycloak/RustFS stack, the same way the released image will actually be
  # run - `integration-tests`/`visual-tests` above only ever exercise the source via
  # `dotnet run`, so an entrypoint bug, a missing runtime file, or a broken env-var
  # substitution has never been caught before an image reached GHCR (#2204). Runs
  # ASPNETCORE_ENVIRONMENT=Production (the released image's real default) so this also
  # exercises RequiredConfigurationValidator and Database:MigrateOnStartup for real.
  backend-image-health-check:
    name: Backend Image Health Check
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/src/Api/Dockerfile
          push: false
          load: true
          tags: backend-health-check:latest
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Start backing services (Postgres, Keycloak, RustFS)
        run: |
          docker network create backend-smoke-test

          docker run -d --name smoke-postgres --network backend-smoke-test \
            -e POSTGRES_USER=afunto -e POSTGRES_PASSWORD=afunto -e POSTGRES_DB=afunto \
            postgres:18-alpine

          IMPORT_DIR="$RUNNER_TEMP/kc-import"
          mkdir -p "$IMPORT_DIR"
          cp keycloak/realms/*-realm.json "$IMPORT_DIR/"

          docker run -d --name smoke-keycloak --network backend-smoke-test -p 18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_FRONTEND_URL=http://localhost:18080 \
            -e KEYCLOAK_BACKEND_SECRET=smoke-test-secret \
            -e KC_SMTP_HOST=localhost -e KC_SMTP_PORT=1025 -e KC_SMTP_FROM=noreply@example.test \
            -e KC_SMTP_USER=test -e KC_SMTP_PASSWORD=test \
            -v "$IMPORT_DIR:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.7.4 start-dev --import-realm

          docker run -d --name smoke-storage --network backend-smoke-test -p 19000:9000 \
            -e RUSTFS_ACCESS_KEY=storage -e RUSTFS_SECRET_KEY=storage123 \
            rustfs/rustfs:1.0.0

      - name: Wait for backing services to be ready
        run: |
          echo "Waiting for Postgres..."
          for i in $(seq 1 60); do
            docker exec smoke-postgres pg_isready -U afunto >/dev/null 2>&1 && break
            if [ "$i" = 60 ]; then echo "::error::Postgres never became ready"; exit 1; fi
            sleep 2
          done

          echo "Waiting for Keycloak to serve the afunto realm..."
          for i in $(seq 1 90); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" \
              http://localhost:18080/realms/afunto/.well-known/openid-configuration || echo 000)
            [ "$code" = "200" ] && break
            if [ "$i" = 90 ]; then echo "::error::Keycloak never served the afunto realm"; exit 1; fi
            sleep 2
          done

          echo "Waiting for RustFS..."
          for i in $(seq 1 60); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost:19000/health || echo 000)
            [ "$code" = "200" ] && break
            if [ "$i" = 60 ]; then echo "::error::RustFS never became ready"; exit 1; fi
            sleep 2
          done

      - name: Run backend image against the test stack
        run: |
          # Smtp__Host/Smtp__Port are dummy values (no SMTP server on this network) -
          # RequiredConfigurationValidator (#2285) fails startup outside Development if
          # they're blank, but this smoke test never triggers an email send, so nothing
          # ever dials them.
          #
          # smoke-keycloak is plain HTTP - no TLS termination in front of it, unlike a
          # real deployment's Authority. Without Authentication__RequireHttpsMetadata=false,
          # JwtBearerHandler throws "MetadataAddress or Authority must use HTTPS" on every
          # request (including anonymous ones, since authentication runs before endpoint
          # routing), which crashes /health and /alive before they can respond. Same fix as
          # ProductionEnvironmentFixture.cs/AppHost.cs use for the same reason - see
          # Program.cs's comment on RequireHttpsMetadata.
          docker run -d --name smoke-backend --network backend-smoke-test -p 18081:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ConnectionStrings__afunto="Host=smoke-postgres;Database=afunto;Username=afunto;Password=afunto" \
            -e Keycloak__ClientSecret=smoke-test-secret \
            -e Keycloak__BaseUrl=http://smoke-keycloak:8080 \
            -e Keycloak__Realm=afunto \
            -e Authentication__Authority=http://smoke-keycloak:8080/realms/afunto \
            -e Authentication__RequireHttpsMetadata=false \
            -e Authentication__ValidIssuers__0=http://smoke-keycloak:8080/realms/afunto \
            -e Cors__Origins__0=http://localhost \
            -e Smtp__Host=localhost \
            -e Smtp__Port=1025 \
            -e Storage__Endpoint=http://smoke-storage:9000 \
            -e Storage__AccessKey=storage \
            -e Storage__SecretKey=storage123 \
            -e Storage__BucketName=afunto \
            -e Database__MigrateOnStartup=true \
            backend-health-check:latest

      - name: Assert /health goes green
        run: |
          # 90x2s=180s, not 60x2s - Database:MigrateOnStartup applies 70+ EF Core
          # migrations to a brand-new database here, which is slower than the warm
          # incremental case every other CI job hits.
          for i in $(seq 1 90); do
            code=$(curl -fsS -o /tmp/health-body.txt -w "%{http_code}" http://localhost:18081/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Backend /health is green:"
              cat /tmp/health-body.txt
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend image's /health never went green (last status: $code) - database, Keycloak, or storage connectivity is broken in the released image."
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: |
          for c in smoke-backend smoke-postgres smoke-keycloak smoke-storage; do
            echo "::group::$c"
            docker logs "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker rm -f smoke-backend smoke-postgres smoke-keycloak smoke-storage >/dev/null 2>&1 || true
          docker network rm backend-smoke-test >/dev/null 2>&1 || true

  publish-backend:
    name: Publish Backend
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests, backend-image-health-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: ${{ github.repository }}-backend
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/src/Api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Scan image for vulnerabilities
        # Report-only: a finding is uploaded to the Security tab but never fails this
        # step or blocks the push below - see SECURITY.md's "Scope" section.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload vulnerability scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: backend-image

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/src/Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          sbom: true
          provenance: mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

  frontend-checks:
    name: Frontend Checks
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    uses: ./.github/workflows/frontend-checks.yml
    with:
      vite_keycloak_authority_url: https://login.example.test/realms/afunto
      vite_keycloak_client_id: frontend
      keycloak_origin: https://login.example.test
      vite_api_url: https://api.example.test
      storage_public_url: https://storage.example.test

  publish-frontend:
    name: Publish Frontend
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_NAME: ${{ github.repository }}-frontend
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      - name: Scan image for vulnerabilities
        # Report-only: a finding is uploaded to the Security tab but never fails this
        # step or blocks the push below - see SECURITY.md's "Scope" section.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload vulnerability scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: frontend-image

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}

  publish-keycloak:
    name: Publish Keycloak
    needs: [backend-fast-tests, backend-integration-tests, backend-visual-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: ${{ github.repository }}-keycloak
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Keycloak upstream version
        id: keycloak
        run: |
          KC_VERSION=$(grep -m1 'FROM quay.io/keycloak/keycloak:' keycloak/Dockerfile | sed 's/.*keycloak:\([^ ]*\).*/\1/')
          echo "upstream_version=${KC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.base.version=${{ steps.keycloak.outputs.upstream_version }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: keycloak
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak-image
          cache-to: type=gha,mode=max,scope=keycloak-image

      - name: Scan image for vulnerabilities
        # Report-only: a finding is uploaded to the Security tab but never fails this
        # step or blocks the push below - see SECURITY.md's "Scope" section. The
        # Keycloak base image in particular has a known CVE with no fix path today
        # (UBI9-micro base layer, no newer Keycloak patch, no package manager to
        # patch in place) - blocking here would fail every release with no
        # actionable next step from this repo alone.
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload vulnerability scan results
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: keycloak-image

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: keycloak
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak-image
          sbom: true
          provenance: mode=max

  github-release:
    name: GitHub Release
    needs: [publish-backend, publish-frontend, publish-keycloak]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes from Conventional Commits
        id: notes
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          # git's default version sort has no semver prerelease concept, so a "-rc.N"
          # suffix sorts *above* the bare version it precedes - the first stable tag
          # (e.g. v1.0.0) sorts below all its own RCs and lands last in the descending
          # list below, so PREV_TAG comes back empty and RANGE falls back to the entire
          # repo history (afunto#1679). This tells git "-rc" is a prerelease
          # marker instead, so v1.0.0 sorts above v1.0.0-rc.N as expected.
          git config versionsort.suffix "-rc"

          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --list 'v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*' --sort=-v:refname \
            | grep -A1 -x -F "$CURRENT_TAG" | tail -n1)
          if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            PREV_TAG=""
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="$PREV_TAG..$CURRENT_TAG"
          fi

          {
            echo "## What's Changed"
            echo

            breaking=$(git log "$RANGE" --pretty=format:'%s' | grep -E '^[a-z]+(\(.+\))?!:' || true)
            if [ -n "$breaking" ]; then
              echo "### Breaking Changes"
              echo "$breaking" | sed 's/^/- /'
              echo
            fi

            declare -A LABELS=( [feat]="Features" [fix]="Bug Fixes" [perf]="Performance" [refactor]="Refactoring" [docs]="Documentation" [revert]="Reverts" )
            for type in feat fix perf refactor docs revert; do
              commits=$(git log "$RANGE" --pretty=format:'%s' | grep -E "^${type}(\(.+\))?!?:" || true)
              if [ -n "$commits" ]; then
                echo "### ${LABELS[$type]}"
                echo "$commits" | sed 's/^/- /'
                echo
              fi
            done

            if [ -z "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${CURRENT_TAG}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURRENT_TAG}"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Append image digest table
        run: |
          {
            echo
            echo "## Images"
            echo
            echo "Pin by digest for a verifiable link between this tag and the exact bytes on GHCR:"
            echo
            echo "| Component | Image | Digest |"
            echo "| --- | --- | --- |"
            echo "| Backend | \`${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ needs.publish-backend.outputs.version }}\` | \`${{ needs.publish-backend.outputs.digest }}\` |"
            echo "| Frontend | \`${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ needs.publish-backend.outputs.version }}\` | \`${{ needs.publish-frontend.outputs.digest }}\` |"
            echo "| Keycloak | \`${{ env.REGISTRY }}/${{ github.repository }}-keycloak:${{ needs.publish-backend.outputs.version }}\` | \`${{ needs.publish-keycloak.outputs.digest }}\` |"
          } >> release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          FLAGS=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating notes instead."
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          fi
