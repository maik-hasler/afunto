name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ban-typographic-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ban em/en dashes (U+2014, U+2013)
        run: |
          # frontend/src/locales/de.json and backend/src/Infrastructure/Email/Templates/de.json
          # are German user-facing content, not source - they use the en dash (Gedankenstrich)
          # per CONTRIBUTING.md's Language Convention. Everything else stays ASCII-only.
          if grep -rPnI '[\x{2013}\x{2014}]' . | grep -vE '^\./(frontend/src/locales/de\.json|backend/src/Infrastructure/Email/Templates/de\.json):'; then
            echo "::error::Em/en dashes found - use plain ASCII hyphens (-) instead"
            exit 1
          fi

  ban-unescaped-keycloak-apostrophes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ban unescaped apostrophes in Keycloak English messages
        run: |
          FILE=keycloak/themes/afunto/login/messages/messages_en.properties
          if grep -nE '^[^#[:space:]].*=' "$FILE" | grep -P "(?<!')'(?!')"; then
            echo "::error::Unescaped apostrophe in $FILE - MessageFormat silently drops it. Escape literal apostrophes as '' (see #1854)."
            exit 1
          fi

  editorconfig:
    runs-on: ubuntu-latest
    env:
      # Pinned on purpose. The npm wrapper (npx editorconfig-checker@x) bundles no
      # binary - it resolves one from the *latest* upstream release at run time, so
      # CI silently follows a project we do not control. That broke the job when
      # v4.0.0 renamed the asset from ec-linux-amd64.tar.gz to the name below.
      # Bump the two values together; the digest is from the release's checksums.txt.
      EC_VERSION: v4.0.1
      EC_SHA256: 90139c6ed52373c0acfc9deb2a07aa812e5184753afd4bc8252bf44eb4909155
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check EditorConfig conformance
        run: |
          ASSET=editorconfig-checker-linux-amd64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$ASSET" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/$EC_VERSION/$ASSET"
          echo "$EC_SHA256  $RUNNER_TEMP/$ASSET" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP" editorconfig-checker
          "$RUNNER_TEMP/editorconfig-checker" -config .editorconfig-checker.json
