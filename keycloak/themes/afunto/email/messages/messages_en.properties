# Overrides every message this realm's settings can send by email, so both languages
# share one structure with the backend's emails (#2402). These are MessageFormat
# patterns: a literal apostrophe would have to be doubled, so the copy avoids them.

emailGreeting=Hi {0},
emailGreetingWithoutName=Hi,
emailClosing=Best wishes,
emailSignature=The Afunto team
emailFooter=You are receiving this email because it was requested for this address on Afunto.
emailLinkExpiry=The link is valid for {0}.

emailVerificationSubject=Confirm your email address
emailVerificationIntro=Please confirm your email address so you can use your Afunto account.
emailVerificationAction=Confirm email address
emailVerificationIgnore=Did not create an Afunto account? Then you can ignore this email.

passwordResetSubject=Reset your password
passwordResetIntro=You asked to reset your Afunto password. Use the button to set a new one.
passwordResetAction=Set a new password
passwordResetIgnore=Did not ask for this? Then ignore this email. Your password stays as it is.

executeActionsSubject=Please update your Afunto account
executeActionsIntro=The Afunto team asks you to update your account: {0}.
executeActionsAction=Update account
executeActionsIgnore=Not expecting this? Then ignore this email.

emailUpdateConfirmationSubject=Confirm your new email address
emailUpdateConfirmationIntro=Please confirm that you want to use {0} for your Afunto account from now on.
emailUpdateConfirmationAction=Confirm new address
emailUpdateConfirmationIgnore=Do not want to change your address? Then ignore this email.

# Listed in executeActionsIntro.
requiredAction.UPDATE_PASSWORD=Set password
requiredAction.UPDATE_PROFILE=Complete profile
requiredAction.VERIFY_EMAIL=Confirm email address
requiredAction.TERMS_AND_CONDITIONS=Accept the terms of use
requiredAction.CONFIGURE_TOTP=Set up two-factor sign-in
