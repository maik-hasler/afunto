parent=base
locales=de,en
styles=css/afunto.css
scripts=js/password-toggle.js js/floating-labels.js

# Where "back to Afunto" goes. Declared once here rather than inlined
# per template because several pages need it and, unlike a normal Keycloak
# deployment, it cannot be derived: the frontend client carries no baseUrl, so
# ${client.baseUrl} - which is what base's error.ftl and logout-confirm.ftl
# test before offering a way out - is always empty, and those pages rendered
# with no exit at all. Also the base for the Terms of Use/Privacy Policy links
# in termsDetails and privacyNotice (messages/messages_*.properties, linked
# from terms.ftl and register.ftl) - one property instead of a second
# hardcoded domain that could drift out of sync with this one
# (afunto#2196).
siteUrl=https://afunto.maik-hasler.de

# Class hooks. This theme overrides every template a visitor can currently
# reach, so these mostly serve the base templates it does not override (TOTP
# enrolment, WebAuthn, identity-provider linking, consent) - none reachable
# with this realm's settings today, all one setting away. Each maps to a real
# rule in afunto.css rather than to a class that exists nowhere, which
# is what "unstyled Keycloak page" actually means in practice.
kcFormGroupClass=form-group
kcLabelWrapperClass=form-label-wrapper
kcLabelClass=form-label
kcInputWrapperClass=form-input-wrapper
kcInputClass=form-input
kcInputGroup=input-group
kcInputErrorMessageClass=form-error
kcFormOptionsClass=form-options
kcFormOptionsWrapperClass=form-options-wrapper
kcFormSettingClass=form-options
kcCheckboxInputClass=checkbox-control
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-secondary
kcButtonBlockClass=btn-block
kcButtonLargeClass=btn-lg
kcFormPasswordVisibilityButtonClass=btn-password-toggle
kcFormPasswordVisibilityIconShow=icon-eye
kcFormPasswordVisibilityIconHide=icon-eye-off
kcFormClass=auth-form
kcFormButtonsClass=form-buttons
kcContentWrapperClass=content-wrapper
