# Legal footer, rendered on every auth page by template.ftl (#2217) - links are
# absolute (properties.siteUrl) since these pages are served from Keycloak's
# own host, not the frontend's.
legalFooterLabel=Legal
legalFooterImprint=Imprint
legalFooterPrivacyPolicy=Privacy Policy
legalFooterTermsOfUse=Terms of Use

# Kept in stock Title Case in base Keycloak ("Sign In", "Forgot Password?");
# overridden here so the login form matches sentence case everywhere else in
# the theme and in the app itself (#2063).
doLogIn=Sign in
doForgotPassword=Forgot password?

# Endonyms in both directions, so "English" and "Deutsch" read the same
# regardless of which language the page is currently in - stock Keycloak
# instead translates the *other* locale's name into the current one
# ("Englisch (English)" from German), unlike the in-app switcher, which
# already uses endonyms for both (#2063).
locale_de=Deutsch
locale_en=English

# Names the step of the funnel each page belongs to. Signing up runs across
# three consecutive Keycloak screens - create account, confirm your address,
# set a password - and nothing on any of them said they were one sequence.
#
# Deliberately not numbered ("step 2 of 3"). Two of these pages are reachable
# from more than one flow - email confirmation can be app-initiated, and
# setting a password is also where a password reset ends - so a count would be
# wrong about as often as it was right.
stepSignIn=Account
stepRegister=New account
stepRecovery=Account recovery
stepVerify=Confirm your email
stepSecurity=Password
stepProfile=Your details
stepSession=Session
stepStatus=Status
stepTerms=Terms of Use

