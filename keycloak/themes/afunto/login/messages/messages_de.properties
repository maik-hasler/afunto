# Benennt den Schritt, zu dem die jeweilige Seite gehört. Die Registrierung
# läuft über drei aufeinanderfolgende Keycloak-Seiten - Konto anlegen,
# Adresse bestätigen, Passwort setzen - und auf keiner stand, dass sie
# zusammengehören.
#
# Bewusst ohne Nummerierung ("Schritt 2 von 3"): zwei dieser Seiten sind aus
# mehr als einem Ablauf erreichbar - die E-Mail-Bestätigung kann von der App
# angestoßen werden, und beim Zurücksetzen des Passworts endet man ebenfalls
# beim Passwort-Formular. Eine Zählung wäre etwa so oft falsch wie richtig.
stepSignIn=Konto
stepRegister=Neues Konto
stepRecovery=Konto wiederherstellen
stepVerify=E-Mail bestätigen
stepSecurity=Passwort
stepProfile=Deine Angaben
stepSession=Sitzung
stepStatus=Status
stepTerms=Nutzungsbedingungen

# Keycloak's stock German strings address the reader as "Sie". The rest of the
# product is consistently "du", so an unstyled fallback message put both forms
# on the same screen - most visibly on the registration form, where our own
# "Bevor du Afunto nutzen kannst..." sat directly above "Bitte geben Sie
# eine E-Mail-Adresse ein."
