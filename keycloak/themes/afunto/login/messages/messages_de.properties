missingFirstNameMessage=Gib bitte deinen Vornamen ein.
missingLastNameMessage=Gib bitte deinen Nachnamen ein.
invalidEmailMessage=Das sieht nicht nach einer gültigen E-Mail-Adresse aus.
invalidUserMessage=Benutzername oder Passwort stimmt nicht.
invalidUsernameOrEmailMessage=Benutzername oder E-Mail-Adresse stimmt nicht.
invalidPasswordMessage=Das Passwort stimmt nicht.
accountDisabledMessage=Dieses Konto ist deaktiviert. Wende dich an den Betreiber der Plattform.
accountTemporarilyDisabledMessage=Dieses Konto ist vorübergehend gesperrt. Versuche es später noch einmal oder wende dich an den Betreiber der Plattform.
usernameExistsMessage=Diesen Benutzernamen gibt es schon. Wähle bitte einen anderen.
emailExistsMessage=Für diese E-Mail-Adresse gibt es schon ein Konto.
readOnlyUsernameMessage=Dein Benutzername lässt sich nicht ändern.
termsAcceptanceRequired=Bestätige bitte die Nutzungsbedingungen, um fortzufahren.

# Passwortregeln, formuliert als das, was zu tun ist - nicht als Urteil über
# das Getippte. Keycloaks Originaltexte beginnen alle mit "Ungültiges
# Passwort:", was das Offensichtliche wiederholt und das Einzige verdeckt,
# womit man den Fehler beheben kann.
notMatchPasswordMessage=Die Passwörter stimmen nicht überein.
invalidPasswordConfirmMessage=Die Passwörter stimmen nicht überein.
invalidPasswordMinLengthMessage=Das Passwort muss mindestens {0} Zeichen lang sein.
invalidPasswordMaxLengthMessage=Das Passwort darf höchstens {0} Zeichen lang sein.
invalidPasswordMinUpperCaseCharsMessage=Das Passwort braucht mindestens {0} Großbuchstaben.
invalidPasswordMinLowerCaseCharsMessage=Das Passwort braucht mindestens {0} Kleinbuchstaben.
invalidPasswordMinDigitsMessage=Das Passwort braucht mindestens {0} Ziffern.
invalidPasswordMinSpecialCharsMessage=Das Passwort braucht mindestens {0} Sonderzeichen.
invalidPasswordNotUsernameMessage=Das Passwort darf nicht dein Benutzername sein.
invalidPasswordNotContainsUsernameMessage=Das Passwort darf deinen Benutzernamen nicht enthalten.
invalidPasswordNotEmailMessage=Das Passwort darf nicht deine E-Mail-Adresse sein.
invalidPasswordHistoryMessage=Wähle ein Passwort, das du bei deinen letzten {0} nicht schon verwendet hast.
invalidPasswordBlacklistedMessage=Dieses Passwort steht auf einer Liste besonders häufiger Passwörter. Wähle bitte ein anderes.

